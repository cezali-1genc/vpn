name: Android Build (APK + AAB)

on:
  push:
    branches: [ "arena/6e62dd79-vpn", "SGmods", "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Go 1.21.3 kur (WireGuard native backend)
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.3'
          cache-dependency-path: wireguard-tunnel/tools/libwg-go/go.sum

      - name: Gradle kur (cache ile)
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK doğrula ve eksikleri kur
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: gradlew çalıştırılabilir yap
        run: chmod +x gradlew

      - name: Kotlin derleme kontrolü
        run: |
          set +e
          ./gradlew :app:compileDebugKotlin --stacktrace > compile.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "Derleme hataları (annotation olarak):"
            grep -E "^e: " compile.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "--- WHAT WENT WRONG ---"
            grep -A 25 "What went wrong" compile.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "--- CAUSED BY ---"
            grep -E "Caused by:" compile.log | head -n 10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $CODE
          fi
          echo "Derleme başarılı"

      - name: Birim testleri
        run: ./gradlew test --stacktrace

      - name: Test raporu yayınla
        if: always() && hashFiles('app/build/test-results/testDebugUnitTest/*.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: Birim Testler
          path: app/build/test-results/testDebugUnitTest/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Debug APK üret
        run: ./gradlew assembleDebug --stacktrace

      - name: Release AAB üret (imzasız — imzalama için Secrets gerekli, bkz. docs/BUILD.md)
        run: ./gradlew bundleRelease --stacktrace

      - name: APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: CloudflareSecureVPN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: AAB artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: CloudflareSecureVPN-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90
